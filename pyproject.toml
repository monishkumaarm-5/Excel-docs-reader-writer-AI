[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doxl-ai-terminal"
version = "0.1.0"
description = "AI-powered terminal for reading and writing Excel & Word documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Mohan"},
]
keywords = ["ai", "excel", "docx", "terminal", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "openpyxl>=3.1.0",
    "python-docx>=0.8.11",
    "pillow>=10.0.0",
    "cryptography>=41.0.0",
    "protobuf>=4.21.1",
    "filelock>=3.12.0",
    "python-dotenv>=1.0.0",
]


[project.scripts]
doxl-ai = "doxl_ai_terminal.cli:main"

[project.urls]
Homepage = "https://github.com/mohan/doxl-ai-terminal"
Issues = "https://github.com/mohan/doxl-ai-terminal/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

