[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doxl-ai-terminal"
version = "0.1.0"
description = "AI-powered terminal for reading and writing Excel & Word documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Monish Kumaar M"},
]
keywords = ["ai", "excel", "docx", "terminal", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "openpyxl>=3.1.0",
    "python-docx>=0.8.11",
    "pillow>=10.0.0",
    "cryptography>=41.0.0",
    "protobuf>=4.21.1",
    "filelock>=3.12.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-google-genai",
    "langgraph",
    "google-genai",
    "sentence-transformers>=2.2.0",
]


[project.scripts]
docs-excel = "doxl_ai_terminal.pipeline.runner:run_graph"
doxl-ai = "doxl_ai_terminal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/monishkumaarm-5/Excel-docs-reader-writer-AI"
Issues = "https://github.com/monishkumaarm-5/Excel-docs-reader-writer-AI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
